# للاستضافة الفعلية (Oracle Cloud / Hetzner — `docs/DEPLOY.md`) — لا للتحقّق
# المحليّ (ذاك في `docker-compose.yml`، منفذ 8000 مباشرةً بلا TLS عمدًا).
#
# طبقة TLS اثنتان بديلتان لا معًا — اختر واحدة بتعليق الأخرى:
#   Caddy   — يحتاج نطاقًا يشير سجلّ A فيه لعنوان الخادم (شهادة تلقائية).
#   Tunnel  — لا يحتاج نطاقًا إطلاقًا؛ رابطٌ عشوائيّ فوريّ من Cloudflare،
#             ولا منفذ داخليّ مفتوح على الخادم (اتصالٌ صادرٌ فقط).
# التفصيل الكامل والأوامر في `docs/DEPLOY.md`.

name: asrab-v2-prod

# **تدوير السجلّات ليس تحسينًا بل منعُ عطل** (و-٢١): سجلّ Docker الافتراضيّ
# (`json-file`) **ينمو بلا حدّ**، وامتلاءُ القرص أشهر أسباب سقوط الخوادم
# الصغيرة — ويسقط معه Postgres فلا يقبل كتابةً، ويبدو العطل عطلَ تطبيق.
# ثلاثون ميغابايتًا × ٣ لكل خدمة سقفٌ أعلاه لا يُتجاوَز.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # `pg_dump` و`pg_restore` يحتاجان مساحةً مشتركة أوسع من ٦٤MB الافتراضية
    # على بعض الاستعلامات — والنسخ الاحتياطيّ اليوميّ هو أوّل من يصطدم بها.
    shm_size: '256mb'
    environment:
      POSTGRES_DB: asrab_v2
      POSTGRES_USER: asrab
      POSTGRES_PASSWORD: '${DB_PASSWORD:?ضع كلمة مرور حقيقية في .env.prod}'
    volumes: [asrab_v2_prod_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asrab -d asrab_v2']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose: ['8000'] # لا `ports:` — لا يصل إليه أحد إلا عبر caddy/cloudflared
    logging: *logging
    # الفحص في الصورة نفسها (`Dockerfile`)، ويُعلَن هنا ليُعرَف للـ`depends_on`
    # أدناه: Caddy تنتظر **صحّةً** لا إقلاعًا، فلا تردّ ٥٠٢ على أوّل زائر.
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\",timeout=4).status==200 else 1)"']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      PORT: '8000'
      FLASK_APP: 'app:create_app'
      DATABASE_URL: 'postgresql+psycopg://asrab:${DB_PASSWORD:?ضع كلمة مرور حقيقية في .env.prod}@db:5432/asrab_v2'
      SECRET_KEY: '${SECRET_KEY:?ولّده بالأمر المذكور في docs/DEPLOY.md}'
      SESSION_COOKIE_SECURE: 'true' # إلزاميّ خلف HTTPS حقيقيّ
      CORS_ALLOWED_ORIGINS: 'https://${DOMAIN:?ضع نطاقك في docs/DEPLOY.md، أو اضبطه لاحقًا مع Cloudflare Tunnel}'
      EXPOSE_API_DOCS: 'false'

  # ── الخيار ١: نطاقٌ حقيقيّ — فعِّل هذه الخدمة، عطِّل cloudflared أدناه ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── الخيار ٢: بلا نطاق بعد — عطِّل caddy أعلاه، فعِّل هذه بدلًا منه ──
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   logging: *logging
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   command: tunnel --no-autoupdate --url http://app:8000

volumes:
  asrab_v2_prod_pgdata:
  caddy_data:
  caddy_config:
